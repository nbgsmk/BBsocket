name: volume-confirmed-trend
version: 1
enabled: true
instruments:
  - btcusdt
aggregation: 5m
indicators:
  - sma:20
  - sma:50
  - rsi:14
  - volumeSma:20
positionEntry:
  matchAll:
    - left: indicator.sma:20
      operator: crossesAbove
      right: indicator.sma:50

    - left: price.close
      operator: ">"
      right: indicator.sma:20

    - left: volume.volume
      operator: ">"
      right: indicator.volumeSma:20

positionExit:
  matchAny:
    - { l: indicator.sma:20, op: crossesBelow, r: indicator.sma:50 }
    - { l: indicator.rsi:14, op: ">", r: 75 }
trade:
  side: long
  size: 0.01
