name: volume-confirmed-trend
version: 1
enabled: true
instruments:
  - btcusdt
aggregation: 5m
indicators:
  - { name: smaF, indicator: "sma:5" }
  - { name: smaS, indicator: "sma:10" }
  - { name: rsi, indicator: "rsi:14" }
  - { name: volSma, indicator: "volumeSma:5" }
positionEntry:
  matchAll:
    - left: indicator.smaF
      operator: crossesAbove
      right: indicator.smaS

    - left: price.close
      operator: ">"
      right: indicator.smaF

    - left: volume.volume
      operator: ">"
      right: indicator.volSma

positionExit:
  matchAny:
    - { l: indicator.smaF, op: crossesBelow, r: indicator.smaS }
    - { l: indicator.rsi, op: ">", r: 75 }
trade:
  side: long
  size: 0.01
