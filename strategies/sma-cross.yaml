name: sma-cross
version: 1
enabled: true
instruments:
  - btcusdt
aggregation: 5m
indicators:
  - sma:2
  - sma:10
  - rsi:14
positionEntry:
  matchAny:
    - left: indicator.sma:2
      operator: crossesAbove
      right: indicator.sma:10
    - { l: indicator.rsi:14, op: ">", r: 70 }

positionExit:
  matchAny:
    - { l: indicator.rsi:14, op: "<", r: 60 }

trade:
  side: long
  size: 0.01
