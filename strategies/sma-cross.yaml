name: sma-cross
version: 1
enabled: true
instruments:
  - btcusdt
aggregation: 5m
indicators:
  - { name: smaFast, indicator: "sma:2" }
  - { name: smaSlow, indicator: "sma:10" }
  - { name: rsi, indicator: "rsi:14" }
positionEntry:
  matchAny:
    - left: indicator.smaFast
      operator: crossesAbove
      right: indicator.smaSlow
    - { l: indicator.rsi, op: ">", r: 70 }

positionExit:
  matchAny:
    - { l: indicator.rsi, op: "<", r: 60 }

trade:
  side: long
  size: 0.01
